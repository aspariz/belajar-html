<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labolatorium DLH</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons for modern icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Applying the Inter font as the default */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb; /* bg-gray-50 */
        }
        /* Custom transition for smoother UI changes */
        .view-container {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .view-hidden {
            opacity: 0;
            transform: scale(0.98);
            pointer-events: none;
            position: absolute;
        }
        .task-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .task-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header Section -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-gray-900">
                <span class="text-blue-600">Labolatorium</span>DLH
            </div>
            <div class="flex items-center space-x-4">
                <span class="hidden sm:inline text-gray-600">Selamat datang, Budi!</span>
                <div class="flex items-center gap-2 bg-gray-100 p-2 rounded-full">
                    <i data-lucide="user-circle-2" class="text-gray-500"></i>
                </div>
                 <button class="bg-red-500 text-white font-semibold px-4 py-2 rounded-lg hover:bg-red-600 transition-colors text-sm">
                    <i data-lucide="log-out" class="w-4 h-4 inline-block sm:hidden"></i>
                    <span class="hidden sm:inline">Logout</span>
                </button>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-10">
        <!-- Dashboard View -->
        <div id="dashboard-view" class="view-container">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900">Status Pengujian</h1>
                <div class="flex items-center gap-2 text-gray-500">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                    <span>Data Real-time</span>
                </div>
            </div>
            
            <!-- Task List -->
            <div id="task-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Task cards will be dynamically inserted here by JavaScript -->
            </div>
        </div>

        <!-- Task Detail View -->
        <div id="task-detail-view" class="view-container view-hidden max-w-5xl mx-auto">
            <button id="back-to-dashboard-btn" class="mb-6 inline-flex items-center gap-2 text-blue-600 hover:text-blue-800 font-semibold">
                <i data-lucide="arrow-left-circle"></i>
                Kembali ke Daftar Tugas
            </button>
            
            <div class="bg-white p-8 rounded-2xl shadow-xl">
                <!-- Task Header -->
                <div class="flex flex-wrap justify-between items-start pb-4 border-b-2 border-dashed mb-6">
                    <div>
                        <h2 id="task-detail-title" class="text-2xl font-bold text-gray-900"></h2>
                        <p id="task-detail-client" class="text-gray-600"></p>
                    </div>
                    <div id="task-detail-status" class="text-sm font-bold py-1 px-3 rounded-full mt-2 sm:mt-0"></div>
                </div>

                <!-- Form Step 1: Sample Data Input -->
                <div id="form-step-1">
                    <h3 class="text-xl font-semibold mb-4 text-gray-800">Langkah 1: Verifikasi dan Input Data Sampel</h3>
                    <form id="sample-data-form" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="tanggalDiterima" class="block text-sm font-medium text-gray-700">Tanggal Diterima</label>
                                <input type="date" id="tanggalDiterima" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" required>
                            </div>
                            <div>
                                <label for="kondisiSampel" class="block text-sm font-medium text-gray-700">Kondisi Sampel</label>
                                <select id="kondisiSampel" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                                    <option>Baik & Tersegel</option>
                                    <option>Wadah Rusak</option>
                                    <option>Segel Terbuka</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label for="catatanPenerimaan" class="block text-sm font-medium text-gray-700">Catatan Penerimaan</label>
                            <textarea id="catatanPenerimaan" rows="3" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Contoh: Suhu sampel saat diterima 10°C."></textarea>
                        </div>
                        <div class="text-right">
                            <button type="submit" class="bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-blue-700 transition-colors inline-flex items-center gap-2">
                                Simpan & Lanjutkan Pengujian
                                <i data-lucide="arrow-right"></i>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Form Step 2: Lab Result Input -->
                <div id="form-step-2" class="hidden mt-10 pt-6 border-t">
                     <h3 class="text-xl font-semibold mb-4 text-gray-800">Langkah 2: Input Hasil Uji Laboratorium</h3>
                     <form id="lab-result-form" class="space-y-4">
                        <!-- Results table header -->
                        <div class="grid grid-cols-4 gap-4 font-semibold text-sm text-gray-600 px-2">
                            <span>Parameter</span>
                            <span class="text-center">Hasil Uji</span>
                            <span class="text-center">Satuan</span>
                            <span class="text-center">Baku Mutu</span>
                        </div>
                        <!-- Results table body -->
                        <div id="results-input-container" class="space-y-2">
                            <!-- Dynamic input rows will be inserted here -->
                        </div>
                        <div>
                            <label for="kesimpulanUji" class="block text-sm font-medium text-gray-700 mt-6">Kesimpulan & Rekomendasi</p>
                            <textarea id="kesimpulanUji" rows="4" class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Contoh: Semua parameter memenuhi baku mutu kecuali COD. Direkomendasikan untuk optimasi proses aerasi pada IPAL."></textarea>
                        </div>
                        <div class="text-right">
                            <button type="submit" class="bg-green-500 text-white font-semibold py-2 px-6 rounded-lg hover:bg-green-600 transition-colors inline-flex items-center gap-2">
                                <i data-lucide="check-circle"></i>
                                Simpan Hasil & Selesaikan Tugas
                            </button>
                        </div>
                     </form>
                </div>
            </div>
        </div>

        <!-- Success Message View -->
        <div id="success-view" class="view-container view-hidden max-w-2xl mx-auto text-center">
            <div class="bg-white p-10 rounded-2xl shadow-xl">
                 <div class="bg-green-100 text-green-600 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-6">
                    <i data-lucide="check-circle-2" class="w-12 h-12"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-900">Tugas Selesai!</h2>
                <p class="mt-2 text-gray-600">Hasil pengujian untuk kode <span id="success-task-id" class="font-semibold"></span> telah berhasil disimpan.</p>
                <button id="success-back-btn" class="mt-8 bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-blue-700 transition-colors">
                    Kembali ke Daftar Tugas
                </button>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Lucide Icons
            lucide.createIcons();

            // --- Mock Data ---
            // In a real application, this would come from a server/database.
            const tasksData = [
                { id: 'LAB-X9K3L1', client: 'Hotel A', sampleType: 'Limbah Cair Produksi', date: '2025-07-14', status: 'Dalam Pengujian', sampleData: { tanggalDiterima: '2025-07-14', kondisiSampel: 'Baik & Tersegel', catatanPenerimaan: 'Suhu 8°C' }, results: {} },
            ];

            const parameters = [
                { key: 'pH', name: 'pH', unit: '-', standard: '6.0 - 9.0' },
                { key: 'BOD', name: 'BOD', unit: 'mg/L', standard: '50' },
                { key: 'COD', name: 'COD', unit: 'mg/L', standard: '100' },
                { key: 'TSS', name: 'TSS', unit: 'mg/L', standard: '50' },
                { key: 'MinyakLemak', name: 'Minyak & Lemak', unit: 'mg/L', standard: '10' },
                { key: 'Amonia', name: 'Amonia', unit: 'mg/L', standard: '10' },
                { key: 'TotalColiform', name: 'Total Coliform', unit: 'MPN/100mL', standard: '10000' },
            ];

            // --- Elements ---
            const dashboardView = document.getElementById('dashboard-view');
            const taskDetailView = document.getElementById('task-detail-view');
            const successView = document.getElementById('success-view');
            const taskListContainer = document.getElementById('task-list');
            const backToDashboardBtn = document.getElementById('back-to-dashboard-btn');
            const sampleDataForm = document.getElementById('sample-data-form');
            const labResultForm = document.getElementById('lab-result-form');
            const formStep2 = document.getElementById('form-step-2');
            const successBackBtn = document.getElementById('success-back-btn');

            let currentTaskId = null;

            // --- Functions ---
            const getStatusBadge = (status) => {
                switch (status) {
                    case 'Menunggu Penerimaan': return 'bg-blue-100 text-blue-800';
                    case 'Dalam Pengujian': return 'bg-orange-100 text-orange-800';
                    case 'Selesai': return 'bg-green-100 text-green-800';
                    default: return 'bg-gray-100 text-gray-800';
                }
            };

            const renderDashboard = () => {
                taskListContainer.innerHTML = '';
                tasksData.forEach(task => {
                    const statusBadge = getStatusBadge(task.status);
                    const taskCard = `
                        <div class="bg-white p-6 rounded-xl shadow-md task-card cursor-pointer" data-task-id="${task.id}">
                            <div class="flex justify-between items-start">
                                <span class="text-sm font-semibold text-blue-600">${task.id}</span>
                                <span class="text-xs font-bold py-1 px-2.5 rounded-full ${statusBadge}">${task.status}</span>
                            </div>
                            <h3 class="text-lg font-bold mt-2 text-gray-900">${task.client}</h3>
                            <p class="text-sm text-gray-500 mt-1">${task.sampleType}</p>
                            <div class="border-t my-4"></div>
                            <div class="flex justify-between items-center text-sm text-gray-500">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="calendar" class="w-4 h-4"></i>
                                    <span>${task.date}</span>
                                </div>
                                <button class="font-semibold text-blue-600 hover:text-blue-800">Lihat Laporan &rarr;</button>
                            </div>
                        </div>
                    `;
                    taskListContainer.innerHTML += taskCard;
                });
                lucide.createIcons(); // Re-render icons
            };

            const switchView = (viewToShow) => {
                [dashboardView, taskDetailView, successView].forEach(v => v.classList.add('view-hidden'));
                viewToShow.classList.remove('view-hidden');
                 window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const populateTaskDetail = (taskId) => {
                const task = tasksData.find(t => t.id === taskId);
                if (!task) return;
                
                currentTaskId = taskId;

                document.getElementById('task-detail-title').textContent = `Tugas: ${task.id}`;
                document.getElementById('task-detail-client').textContent = `${task.client} - ${task.sampleType}`;
                const statusEl = document.getElementById('task-detail-status');
                statusEl.textContent = task.status;
                statusEl.className = `text-sm font-bold py-1 px-3 rounded-full ${getStatusBadge(task.status)}`;
                
                // Populate Step 1
                sampleDataForm.reset();
                formStep2.classList.add('hidden');
                document.querySelector('#form-step-1 button[type="submit"]').disabled = false;
                
                // Populate Step 2
                const resultsContainer = document.getElementById('results-input-container');
                resultsContainer.innerHTML = '';
                parameters.forEach(p => {
                    const inputRow = `
                        <div class="grid grid-cols-4 gap-4 items-center p-2 rounded-lg hover:bg-gray-50">
                            <label for="${p.key}" class="text-sm font-medium text-gray-700">${p.name}</label>
                            <input type="number" step="0.01" id="${p.key}" name="${p.key}" class="w-full text-center px-2 py-1 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            <span class="text-center text-sm text-gray-500">${p.unit}</span>
                            <span class="text-center text-sm text-gray-500">${p.standard}</span>
                        </div>
                    `;
                    resultsContainer.innerHTML += inputRow;
                });
                labResultForm.reset();

                // Handle already completed steps
                if (task.status === 'Dalam Pengujian' || task.status === 'Selesai') {
                    document.getElementById('tanggalDiterima').value = task.sampleData.tanggalDiterima || '';
                    document.getElementById('kondisiSampel').value = task.sampleData.kondisiSampel || 'Baik & Tersegel';
                    document.getElementById('catatanPenerimaan').value = task.sampleData.catatanPenerimaan || '';
                    document.querySelector('#form-step-1 button[type="submit"]').disabled = true;
                    formStep2.classList.remove('hidden');
                }
                 if (task.status === 'Selesai') {
                    Object.keys(task.results).forEach(key => {
                        const input = document.getElementById(key);
                        if (input) input.value = task.results[key];
                    });
                    document.querySelector('#form-step-2 button[type="submit"]').disabled = true;
                } else {
                     document.querySelector('#form-step-2 button[type="submit"]').disabled = false;
                }
            };
            
            // --- Event Listeners ---
            taskListContainer.addEventListener('click', (e) => {
                const card = e.target.closest('.task-card');
                if (card) {
                    const taskId = card.dataset.taskId;
                    populateTaskDetail(taskId);
                    switchView(taskDetailView);
                }
            });

            backToDashboardBtn.addEventListener('click', () => {
                renderDashboard();
                switchView(dashboardView);
            });
            
            successBackBtn.addEventListener('click', () => {
                renderDashboard();
                switchView(dashboardView);
            });

            sampleDataForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const task = tasksData.find(t => t.id === currentTaskId);
                if (!task) return;

                // Save data to mock object
                task.status = 'Dalam Pengujian';
                task.sampleData.tanggalDiterima = document.getElementById('tanggalDiterima').value;
                task.sampleData.kondisiSampel = document.getElementById('kondisiSampel').value;
                task.sampleData.catatanPenerimaan = document.getElementById('catatanPenerimaan').value;

                // Update UI
                formStep2.classList.remove('hidden');
                e.target.querySelector('button[type="submit"]').disabled = true;
                const statusEl = document.getElementById('task-detail-status');
                statusEl.textContent = task.status;
                statusEl.className = `text-sm font-bold py-1 px-3 rounded-full ${getStatusBadge(task.status)}`;
                alert('Data sampel berhasil disimpan. Silakan lanjutkan input hasil uji.');
            });

            labResultForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const task = tasksData.find(t => t.id === currentTaskId);
                if (!task) return;

                // Save results
                task.status = 'Selesai';
                const formData = new FormData(e.target);
                for (let [key, value] of formData.entries()) {
                    if (value) {
                       task.results[key] = parseFloat(value);
                    }
                }
                task.results.kesimpulan = document.getElementById('kesimpulanUji').value;
                
                // Show success view
                document.getElementById('success-task-id').textContent = task.id;
                switchView(successView);
            });

            // --- Initial Render ---
            renderDashboard();
        });
    </script>
</body>
</html>
